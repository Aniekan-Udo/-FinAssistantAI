services:
  - type: web
    name: finassist
    runtime: python
    plan: free
    # Pre-download the ONNX embedding model at build time so cold starts don't fetch it
    buildCommand: >-
      pip install -r requirements.txt &&
      python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5')"
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FASTEMBED_CACHE_PATH
        value: ./.fastembed_cache
      - key: API_KEY            # Groq API key
        sync: false
      - key: POSTGRES_ASYNC_URI # Neon Postgres URI (pgvector enabled)
        sync: false
      - key: USER_AGENT
        value: finassist-demo
